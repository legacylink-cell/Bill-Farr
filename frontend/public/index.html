        <meta property="og:site_name" content="Bill Farr Photography" />
        <meta property="og:title" content="Bill Farr — Western & Travel Photography" />
        <meta property="og:description" content="Cinematic, human, and honest photography from the open range to the far horizon. Ranch sessions, commissions & travel." />
